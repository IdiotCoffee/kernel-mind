[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "kernelmind"
version = "0.0.1"
requires-python = ">=3.9"
description = "KernelMind: a self-hosted multi-stage code retrieval engine"
readme = "README.md"

# clean dependency list for users
dependencies = [
    "chromadb>=1.3.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "torch",                             # CPU wheel installs automatically
    "pydantic>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tqdm>=4.0",
    "pymongo>=4.0.0",
    "ollama",
    "openai"
]

# Include all kernelmind modules + subpackages
[tool.setuptools.packages.find]
include = ["kernelmind", "kernelmind.*"]


[project.scripts]
km = "kernelmind.cli:cli"
kernelmind = "kernelmind.cli:cli"

[tool.setuptools.package-data]
kernelmind = ["parsers/js/*.js", "parsers/js/package.json"]

